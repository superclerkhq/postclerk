<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="same-origin" />
    <script>
      try {
        if (localStorage.getItem("theme") !== "light") document.documentElement.classList.add("dark")
      } catch {
        document.documentElement.classList.add("dark")
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Postclerk</title>
    <meta
      name="description"
      content="Free, open-source social media scheduler for Instagram, Facebook, LinkedIn, Threads, TikTok, YouTube and Google Business Profile."
    />
    <meta property="og:title" content="Postclerk" />
    <meta property="og:description" content="Free, open-source social media scheduler. Sign in with Superclerk." />
    <meta property="og:image" content="https://postclerk.io/calendar.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
